<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enquiry - APU Valorant Club</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="nav-placeholder"></div>
    <section class="page-banner">
      <h1>Enquiry</h1>
      <p>Home / Contact / Enquiry</p>
    </section>
    <main class="enquiry-container">
      <section class="contact-form">
        <h2>ENQUIRY</h2>
        <form>
          <label>Full Name *</label>
          <input type="text" required />

          <label>Email Address *</label>
          <input type="email" required />

          <label>Subject *</label>
          <input type="text" required />

          <label>Message *</label>
          <textarea rows="6" required></textarea>
          <br />

          <button type="submit" class="button2">Send Message</button>
        </form>
      </section>
      <aside class="contact-info">
        <h2>CONTACT INFORMATION</h2>
        <div class="contact-item">
          <img src="" alt="Email Icon" />
          <p>📧 Email</p>
          <p>apuvalorantclub@apu.edu.my</p>
        </div>

        <div class="contact-item">
          <img src="" alt="Instragram Icon" />
          <p>Instragram</p>

          <a
            href="https://www.instagram.com/apu_esc?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw=="
            ><p>@apu_esc | APU E-Sports Club</p></a
          >
        </div>

        <div class="contact-item">
          <img src="" alt="Discord Icon" />
          <p>Discord</p>
        </div>

        <div class="contact-item">
          <img src="" alt="Clock Icon" />
          <p>🕒 Office Hours Monday</p>
          <p>Friday 9:00 AM</p>
          <p>5:00 PM</p>
        </div>
        <div class="contact-item">
          <img src="" alt="Map Icon" />
          <p>📍 Location</p>
          <p>Asia Pacific University (APU)</p>
          <p>Block B,Level 11</p>
          <p>APU CAMPUS</p>
        </div>
      </aside>
    </main>

    <div id="footer-placeholder"></div>
    <script src="navBar.js"></script>
    <script src="footer.js"></script>
  </body>
</html>
